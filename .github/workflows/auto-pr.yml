name: Branch naming

# Deletes branches that don't follow the naming convention. Nothing else.
#
# The deletion is the part to know about before merging this: a push to, say,
# `wip` or `joshua/experiment` removes the remote branch. The local one is
# untouched, so nothing is lost — but the push is undone. The prefixes are the
# ones AGENTS.md §8 names, and the rule exists so the branch protection and the
# release flow have one shape of branch to reason about.
#
# It used to open a draft pull request into `dev` as well. That needed "Allow
# GitHub Actions to create and approve pull requests", and that setting is off:
# a workflow able to open a pull request is a workflow able to *approve* one the
# day a ruleset asks for a review. The pull requests it opened also carried
# `github-actions` as their author, which parks their checks on
# `action_required` instead of running them — so every branch pushed here
# needed a click before CI would start, and #76 sat waiting for one. Pull
# requests are opened by whoever pushed the branch, with `gh pr create`.
#
# Dependabot manages its own branches and PRs, release.yml manages its own
# release/* housekeeping branch + PR, and lockfile-maintenance.yml manages
# `maintenance/lockfile` — all three are ignored here, otherwise the naming rule
# below would delete them on sight. The last one matters because it is written
# with an app token, which, unlike GITHUB_TOKEN, does start this workflow.
on:
  push:
    branches-ignore:
      - "main"
      - "dev"
      - "dependabot/**"
      - "release/**"
      - "maintenance/**"

permissions:
  contents: write   # deleting the ref, and nothing else

jobs:
  enforce:
    name: Enforce branch naming
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the only call is `gh api` against an explicit path, so
      # there is no working copy to hold a credential and nothing third-party
      # runs in this job. The branch name arrives through `env:` rather than
      # inline `${{ }}`, which is the rule everywhere in this repository — a
      # ref name is attacker-chosen input, and `${{ }}` in a `run:` block is
      # substituted into the script before the shell sees it.
      - name: Delete a branch that does not match the naming convention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -qE '^(feature|fix|chore|docs|test)/.+'; then
            echo "::warning::Branch '$BRANCH' does not match naming convention. Deleting."
            gh api -X DELETE "/repos/${REPO}/git/refs/heads/${BRANCH}"
          fi
