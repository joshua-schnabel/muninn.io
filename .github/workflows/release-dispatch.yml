name: Release (dispatch)

# One-click release. Pick patch / minor / major; this computes the next SemVer
# version from the last release, stamps CHANGELOG.md and Cargo.toml, and opens an
# auto-merging PR into main. From there the normal pipeline takes over: ci.yml
# publishes the image (Docker Hub + ghcr) and tags vX.Y.Z, then release.yml
# creates the GitHub Release and reopens the changelog on dev.
#
# The one manual decision left is the bump type. Nothing here decides *whether*
# to release — the changelog does, and the workflow refuses an empty one.
#
# NOTE: `workflow_dispatch` only appears in the Actions UI when the workflow file
# is on the DEFAULT branch. Landing this on `dev` is not enough; the button shows
# up once `main` carries it, which happens with the next dev → main merge.
#
# Adapted from huginn.io's workflow of the same name. Three things differ, each
# because a rule in *this* repository requires it, and each is commented where it
# happens: the changelog version is read through scripts/changelog-version.sh,
# the version bump goes through scripts/set-workspace-version.sh so Cargo.lock
# moves with Cargo.toml, and the merge is a squash because that is the only
# method this repository enables.
#
# Only the repository owner may run it (the first step asserts this). RELEASE_PAT
# is needed so the release PR triggers CI and can auto-merge — see release.yml
# and docs/ci-cd.md. Without it the PR is still opened; you merge it by hand.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    name: Prepare and merge release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege per job, as everywhere else here — declared on the job
    # rather than the workflow so adding a second job cannot inherit write.
    permissions:
      contents: write        # push the release branch
      pull-requests: write   # open it, and queue auto-merge
    steps:
      - name: Verify the triggering actor is the repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner ($OWNER) may run this workflow (actor: $ACTOR)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0   # tags, so the base version can be computed
          # Credentials are persisted here deliberately, unlike the jobs that run
          # `cargo`: this job pushes a branch. It executes no third-party code —
          # git, awk, sed, grep and gh only — which is what makes that acceptable.
          # See docs/ci-cd.md, "What can reach a credential".
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute the version, stamp the changelog, open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # Base = the higher of the latest v* tag and the topmost released
          # changelog version, so the very first release still bumps from what
          # the changelog documents rather than from 0.0.0.
          #
          # The changelog side goes through the shared script rather than a grep:
          # it validates SemVer *before* printing, which is what keeps a heading
          # such as `## [0.1.2$(...)]` from reaching this shell as command
          # substitution. It exits non-zero when there is no released entry yet —
          # the normal state on dev between releases — so a failure here means
          # "no released version", not an error.
          TAG_V="$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')"
          CL_V="$(bash scripts/changelog-version.sh 2>/dev/null || true)"
          BASE="$(printf '%s\n%s\n' "$TAG_V" "$CL_V" | grep -E '^[0-9]' | sort -V | tail -1 || true)"
          if [ -z "$BASE" ]; then
            BASE=0.0.0
          fi

          # ${BASE%%-*} drops any pre-release suffix: 0.2.0-rc.1 bumps from 0.2.0.
          IFS=. read -r MA MI PA <<< "${BASE%%-*}"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          N="${MA}.${MI}.${PA}"
          echo "Base $BASE + $BUMP -> $N"

          if git ls-remote --tags origin "refs/tags/v${N}" | grep -q .; then
            echo "::error::tag v${N} already exists"
            exit 1
          fi

          # Refuse to cut an empty release. A version that documents nothing is
          # worse than no release: it is the changelog, not the tag, that tells an
          # operator whether upgrading is worth it.
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::no ## [Unreleased] section in CHANGELOG.md"
            exit 1
          fi
          BODY="$(awk 'BEGIN{f=0}
                       f && substr($0,1,4)=="## [" {exit}
                       $0=="## [Unreleased]" {f=1; next}
                       f && NF>0 {print}' CHANGELOG.md)"
          if [ -z "$BODY" ]; then
            echo "::error::## [Unreleased] is empty — nothing to release."
            exit 1
          fi

          DATE="$(date +%F)"
          BR="release/v${N}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"

          # Stamp the top ## [Unreleased] as the release heading; the entries stay
          # under it. Regex-free substring match — a dynamic awk regex holding the
          # version's dots is mis-compiled by gawk, the same trap release.yml's
          # notes extraction documents.
          awk -v head="## [${N}] - ${DATE}" 'BEGIN{d=0}
               d==0 && $0=="## [Unreleased]" { print head; d=1; next }
               { print }' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          # Compare and tag links. Both branches matter: the changelog carries no
          # link section at all until the first release adds one.
          sed -i "s#^\[Unreleased\]:.*#[Unreleased]: ${REPO_URL}/compare/v${N}...HEAD#" CHANGELOG.md || true
          if ! grep -q "^\[${N}\]:" CHANGELOG.md; then
            if grep -q '^\[Unreleased\]:' CHANGELOG.md; then
              sed -i "/^\[Unreleased\]:/a [${N}]: ${REPO_URL}/releases/tag/v${N}" CHANGELOG.md
            else
              printf '\n[%s]: %s/releases/tag/v%s\n' "$N" "$REPO_URL" "$N" >> CHANGELOG.md
            fi
          fi

          # Cargo.toml *and* Cargo.lock, through the shared helper. Bumping only
          # the manifest leaves every `--locked` job failing with "cannot update
          # the lock file" before a test runs — the two files are one fact.
          bash scripts/set-workspace-version.sh "$N"

          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "release: v${N}"
          # Force, so re-running after a failed attempt reuses the branch rather
          # than wedging on it. The branch belongs to this workflow alone.
          git push -f origin "$BR"

          if [ "$(gh pr list --head "$BR" --base main --json number --jq length)" = "0" ]; then
            # The branch is pushed either way, so the work is never lost — see the
            # note in auto-pr.yml about the repository setting this needs.
            gh pr create --base main --head "$BR" \
              --title "release: v${N}" \
              --body "Automated **${BUMP}** release, cut from \`dev\`. Merges to \`main\` once the checks pass; the pipeline then publishes the multi-arch image to Docker Hub and ghcr, tags \`v${N}\`, and \`release.yml\` creates the GitHub Release and reopens the changelog on \`dev\`." || \
              echo "::warning::Could not open the release PR; branch ${BR} is pushed — open it by hand. If the error mentions permissions, see docs/ci-cd.md."
          fi

          # A merge commit, not a squash: `dev → main` is the one place this
          # repository keeps history (AGENTS.md §8, docs/CONTRIBUTING.md).
          # Squashing here would give main a single commit whose parents dev
          # never shares, and the next `main → dev` sync would conflict with
          # itself. Needs "Allow merge commits" enabled — see docs/ci-cd.md.
          gh pr merge --auto --merge "$BR" || \
            echo "::warning::Could not enable auto-merge (RELEASE_PAT missing?). Merge the PR manually."
