name: CI

# The tag is this pipeline's *output*, not a second way into it.
#
# `tags: ["v*.*.*"]` used to be here, and `publish` creates the release tag as
# its last step — so a push to main built and published the image, created the
# tag, and the tag then re-entered this same workflow and built and published it
# again. Two builds, two manifests, one moving `:x.y.z` tag; whichever run
# finished last won. Meanwhile release.yml, fired by that tag, assembled the
# SBOM and the release notes from whatever the tag resolved to at that moment.
# Every gate stayed green because nothing compared the two.
#
# v0.3.0 shipped that way. Found in huginn.io, which has the same pipeline shape
# and the same bug (joshua-schnabel/huginn.io#69).
on:
  push:
    branches: ["main", "dev"]
  # Every PR, whatever its target branch — so every change is gated before merge.
  pull_request:

# Cancel superseded PR runs. Never cancel a push run — it may be mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal default permissions — no secrets exposed to PR builds
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The version the Dockerfile pins and the reference configuration is verified
  # against. Kept here so the reference job and the image cannot drift; the
  # Dockerfile remains the authority and is checked against this value.
  TELEGRAF_VERSION: "1.39.2"

# ── Pipeline shape ─────────────────────────────────────────────────────────
#
#   ── Source ──────────────────────────────────────────────────────────────
#   check ─┬ test (stable + beta·canary) ─┐
#          ├ msrv (the rust-version floor still builds) ────┤
#          ├ supply-chain ────────────────┤
#          ├ coverage ────────────────────┤
#          ├ reference (Telegraf accepts the target format) ┤
#          └ version-gate (SemVer + successor, main only) ──┤
#                                         ▼
#                                    SOURCE GATE
#   ── Image ─────────────────────────────┼─────────────────────────────────
#                                         ▼
#              build (per arch, native) → image.tar artifact
#                 ├ scan        (Trivy on the artifact)
#                 ├ integration (compose stack + hardened image, on the artifact)
#                 └ updates     (the updates module against real host trees)
#                                         ▼
#                                     IMAGE GATE
#   ── Release (push events only) ────────┼─────────────────────────────────
#                                         ▼
#              push (per arch) → skopeo by digest → digest artifact
#                                         ▼
#              publish → DockerHub manifest, mirror to ghcr, staging cleanup, tag
#                                         ▼            (tag push → release.yml:
#                                                       GitHub Release + dev PR)
#
# The two gates are the stage boundaries, not commentary beside them: `build`
# depends on `source-gate` and `push` on `image-gate`, so each stage's membership
# is written down exactly once, in that gate's `needs`. It used to be written
# twice — `build` re-listed the source jobs — and two copies of a list are a list
# that drifts. See the gate jobs below for the rest of the reasoning.
#
# `coverage` deliberately hangs off `check` rather than `test`: cargo-llvm-cov
# runs the whole workspace suite itself, instrumented, so waiting for `test`
# bought no extra confidence — only a wait on the beta leg, which cannot block
# anything.
#
# One job, one responsibility. The image is built ONCE per arch into a tarball;
# every later job consumes that same artifact, so the bytes scanned, tested and
# published are identical. push sits behind image-gate, which covers scan AND
# integration AND updates, so nothing unscanned or untested can ship.
#
# Two jobs have no counterpart in huginn.io's pipeline, both from WP0 findings:
# `reference` (the target TOML must still be real Telegraf) and `updates` (the
# module that reads the host's package state, which only a real host tree can
# exercise). See docs/ci-cd.md.

jobs:
  # ── Source: Format & Lint ─────────────────────────────────────────────────
  # The `Source ·` / `Image ·` / `Release ·` prefixes exist only to make the run
  # page group by stage — GitHub has no stages of its own, and the run graph is
  # drawn from `needs` alone. The three *gate* names carry no prefix: they are
  # what the branch ruleset requires, and renaming a required check leaves it
  # never reporting, which blocks every pull request. Prefix new jobs; leave the
  # gates alone.
  check:
    name: Source · Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `persist-credentials: false` is on every checkout in this repository
      # except the two that push — ci.yml `publish` and release.yml
      # `prepare-dev`, both marked where they are.
      #
      # The default writes the job's token into `.git/config`, where anything
      # running afterwards can read it. What runs afterwards here is `cargo`,
      # which compiles and executes `build.rs` and proc-macros from every
      # dependency in the tree. A token that is not on disk is one a compromised
      # crate cannot take. Steps that genuinely need the API get `GH_TOKEN` in
      # `env:` on that step alone, which the checkout never sees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the action's v1 SHA, which makes `toolchain` a required input —
      # the channel itself stays floating, only the action code is frozen.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Source: Tests (stable + beta) ─────────────────────────────────────────
  test:
    name: Source · Tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false   # report both matrix legs even if one fails
      matrix:
        rust: [stable, beta]
    # beta = next Rust compiler. A canary: non-blocking (continue-on-error) so an
    # upcoming-toolchain break warns without blocking the merge.
    continue-on-error: ${{ matrix.rust == 'beta' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The unix-only tests — signals, permissions, reaping — are the ones that
      # matter most here and are silently absent on the maintainer's Windows
      # machine. They need the Telegraf the artefact ships, which is what
      # scripts/test-linux.sh gives them locally.
      #
      # From the checksum-pinned tarball the Dockerfile already names, not from
      # the `telegraf:x.y.z` image tag. A tag is mutable: whoever can move it
      # decides which binary the unix-only tests run against, and Dependabot
      # does not watch a `docker create` reference (dependabot-core#5819 — the
      # same limitation security.yml records for its Semgrep image). The script
      # reads the version and the per-arch SHA-256 out of the Dockerfile, so
      # there is one pin to maintain and it is the one ADR-0011 already
      # describes.
      - name: Fetch the pinned Telegraf binary
        run: bash scripts/fetch-telegraf.sh "${{ runner.temp }}"

      - name: cargo test
        env:
          MUNINN_TELEGRAF_BIN: ${{ runner.temp }}/telegraf
        run: cargo test --workspace --locked

  # ── Source: the declared MSRV actually compiles ───────────────────────────
  # `rust-version` in Cargo.toml is the supported floor, and until now nothing
  # compiled with it. The Docker builder sits above it deliberately — Dependabot
  # moves that tag and doing so is an update, not an MSRV change — and the
  # matrix above runs floating stable and beta, which are the *current* and
  # *forward* compatibility questions. The floor was neither (F-12).
  #
  # Resolver 3 is MSRV-aware and will hold a dependency back rather than require
  # a newer compiler, so a broken floor does not announce itself: it silently
  # keeps the project on an older crate. That is how a project stays on the
  # release before a CVE fix, which is the trap Cargo.toml's own comment
  # describes.
  #
  # The version is read from the manifest rather than written here. A number
  # repeated in a workflow is one that goes stale the morning someone raises the
  # floor, and nothing fails when it does.
  msrv:
    name: Source · MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared floor
        id: msrv
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::no rust-version in Cargo.toml — this job reads the manifest rather than repeating the number" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV floor: $version"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `--locked`, because the committed lockfile is what ships. Resolving
      # afresh here would let the floor pass against a dependency set nobody
      # builds.
      #
      # Tests as well as the library: `--all-targets` is what catches a floor
      # broken by a test-only dependency or by syntax in a test, which is still
      # a broken floor for anyone building from source.
      - name: cargo check on the floor
        run: cargo check --workspace --all-targets --locked

  # ── Source: Supply-chain security (cargo-deny) ────────────────────────────
  # cargo-deny is a superset of cargo-audit: advisories, licenses, banned
  # crates and registry sources in one pass.
  supply-chain:
    name: Source · Supply-Chain Security
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Uncached on purpose, but pinned. The freshness that matters comes from
      # the *advisory database*, which cargo-deny fetches at run time — not from
      # the tool binary. Pinning the version therefore costs nothing in coverage
      # and removes an unpinned `cargo install` that compiles and runs a third
      # party's build scripts on every CI run. Exactly the reasoning
      # security.yml applies to its Semgrep image: pinned by digest, still
      # scanning with current rules.
      #
      # Dependabot's `cargo` ecosystem does not see this line — it reads
      # Cargo.toml, and cargo-deny is not a dependency. Bump it by hand.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check
        run: cargo deny check

  # ── Source: Code coverage ≥ 80 % ──────────────────────────────────────────
  # Depends on `check`, not on `test`, so it runs *alongside* the two toolchain
  # legs instead of behind them. `cargo llvm-cov --workspace` runs the whole
  # suite itself, instrumented — waiting for `test` first never added confidence,
  # it only added the duration of a full workspace suite to the critical path,
  # and part of that wait was the beta leg, which `continue-on-error` forbids
  # from blocking anything. The cost is a coverage run that is also spent on a
  # red push; `source-gate` still lists both jobs, so nothing stops blocking.
  coverage:
    name: Source · Code Coverage (≥ 80%)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Cache the cargo-llvm-cov binary (pinned) so it is compiled from source
      # once, not every run.
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-0.8.7
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      # From the checksum-pinned tarball the Dockerfile already names, not from
      # the `telegraf:x.y.z` image tag. A tag is mutable: whoever can move it
      # decides which binary the unix-only tests run against, and Dependabot
      # does not watch a `docker create` reference (dependabot-core#5819 — the
      # same limitation security.yml records for its Semgrep image). The script
      # reads the version and the per-arch SHA-256 out of the Dockerfile, so
      # there is one pin to maintain and it is the one ADR-0011 already
      # describes.
      - name: Fetch the pinned Telegraf binary
        run: bash scripts/fetch-telegraf.sh "${{ runner.temp }}"

      - name: Run coverage
        env:
          MUNINN_TELEGRAF_BIN: ${{ runner.temp }}/telegraf
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80

      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

      # The number, where the run that produced it already is. Deliberately not
      # a third-party coverage service: the percentage is something this
      # pipeline computes, and shipping every line of the source tree to an
      # external host to have it computed again buys a badge and costs a
      # dependency with repository access. The README badge reports this job's
      # verdict instead — green means the gate above held.
      #
      # Read from lcov.info rather than parsed out of cargo's output: LF/LH are
      # a stable file format, and a summary table is not.
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -s lcov.info ]; then
            echo "::warning::no lcov.info was produced; the summary is empty"
            exit 0
          fi
          awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit   += $2 }
            END {
              if (found == 0) { print "No coverage data."; exit }
              printf "## Coverage\n\n**%.2f %%** of %d workspace lines (gate: at least 80 %%)\n",
                     hit * 100 / found, found
            }
          ' lcov.info >> "$GITHUB_STEP_SUMMARY"

  # ── Source: the target format is still real Telegraf ──────────────────────
  # muninn's own addition, from the WP0 findings. Three things drift silently
  # and none of them is visible to a Rust test:
  #
  #   - docs/reference/telegraf.reference.conf is what the renderer targets and
  #     what the snapshots are anchored to. If the pinned Telegraf stops
  #     accepting it, every snapshot still passes and the artefact is wrong.
  #   - the ordering fixtures are the evidence for ADR-0007. Both pass
  #     `config check`; only the emitted metric count tells them apart.
  #   - every plugin option named in docs/modules.md must exist upstream. This
  #     is what catches documentation drifting away from the shipped version,
  #     which is R5.
  reference:
    name: Source · Telegraf reference & docs
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # The Dockerfile is the authority on which Telegraf is shipped. If this
      # workflow's TELEGRAF_VERSION ever disagrees, the reference below would be
      # verified against a version the image does not carry.
      - name: The pinned version matches the Dockerfile
        run: |
          in_dockerfile="$(grep -oE 'TELEGRAF_VERSION=[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d= -f2)"
          if [ -z "$in_dockerfile" ]; then
            echo "::error::could not read TELEGRAF_VERSION from the Dockerfile"
            exit 1
          fi
          if [ "$in_dockerfile" != "$TELEGRAF_VERSION" ]; then
            echo "::error::Dockerfile pins $in_dockerfile, this workflow pins $TELEGRAF_VERSION"
            exit 1
          fi
          echo "OK: both pin $TELEGRAF_VERSION"

      # Checks 3-7 of the design-package suite: the reference config, the
      # ordering fixtures, the plugin options, the Telegraf checksums and the
      # documentation cross-references. Check 1 is skipped because `check`,
      # `test` and `supply-chain` above are the same gates on their own runners.
      - name: Verify the design package
        env:
          VERIFY_SKIP_CARGO: "1"
        run: bash scripts/verify-design-package.sh

  # ── Source: release version gate (SemVer + must exceed the last tag) ──────
  # Enforces only for a release context: a PR whose base is main, or a push to
  # main. On every other event it is a deliberate no-op pass rather than a
  # skipped job: `source-gate` treats anything that is not `success` as a
  # failure, so skipping here would fail the gate and take `build` with it. This
  # job must always run and decide internally whether to enforce.
  version-gate:
    name: Source · Version gate
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # need the tag history to find the last release
      - name: Validate SemVer and successor
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          # Only a release cut is gated: PR into main, or a push to main.
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then :
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then :
          else
            echo "Not a release event (base is not main) — version gate is a no-op."
            exit 0
          fi

          # Extraction *and* SemVer validation live in the shared script, so the
          # gate and the publish job cannot drift apart. Deliberately without
          # --allow-unreleased: a release must name its version in the changelog.
          NEW="$(bash scripts/changelog-version.sh)"
          echo "CHANGELOG version: $NEW"

          # The changelog and the manifest have to agree before anything is
          # built from them. They are stamped by the same release job, but by
          # two different edits — a branch where one landed and the other did
          # not would otherwise publish an image whose `--version` disagrees
          # with the tag, the release notes and the SBOM, with every gate green.
          #
          # The manifest is read the way changelog-version.sh reads it for its
          # own fallback: the first `version` under [workspace.package], which
          # every crate inherits.
          CARGO="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "Cargo.toml version:  $CARGO"
          if [ "$NEW" != "$CARGO" ]; then
            echo "::error::CHANGELOG.md says $NEW and [workspace.package].version says $CARGO — run scripts/set-workspace-version.sh $NEW, which stamps the manifest and the lock file together"
            exit 1
          fi

          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$LAST" ]; then
            echo "No existing v* tag — treating $NEW as the first release."
            exit 0
          fi
          echo "Last released version: $LAST"

          if [ "$NEW" = "$LAST" ]; then
            echo "::error::Version $NEW equals the last release — bump it before releasing"
            exit 1
          fi
          # sort -V is not full SemVer pre-release precedence, but is correct for
          # x.y.z and adequate for the 0.x / -rc versions used here.
          HIGHEST=$(printf '%s\n%s\n' "$LAST" "$NEW" | sort -V | tail -1)
          if [ "$HIGHEST" != "$NEW" ]; then
            echo "::error::Version $NEW is not greater than the last release $LAST"
            exit 1
          fi
          echo "OK: $NEW is a valid successor to $LAST"

  # ── Build ONCE per arch → image.tar artifact ──────────────────────────────
  # One build per architecture on its own native runner (amd64 on ubuntu-latest,
  # arm64 on ubuntu-24.04-arm — no QEMU). The tarball is uploaded as an artifact
  # and is the single source of truth for scan, integration, updates and publish.
  build:
    name: Image · Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # The whole source stage, named once — see `source-gate` below. This used to
    # re-list its seven members, which made `source-gate.needs` a second copy of
    # the same set: a job added to the gate alone would block the merge but not
    # the build, and a job added to `build` alone would gate nothing. `msrv` had
    # already fallen out of this list once.
    needs: [source-gate]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/muninn
          labels: |
            org.opencontainers.image.title=muninn.io
            org.opencontainers.image.description=Supervisor and configuration layer around Telegraf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The build verifies Telegraf's SHA-256 per architecture and fails on a
      # mismatch — ADR-0011. That check is inside the Dockerfile, so it runs here
      # whatever the caller does.
      - name: Build image to a local tarball
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: muninn:ci
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  # ── Scan the built artifact (never rebuilds it) ───────────────────────────
  # Runs on ubuntu-latest for both arches: Trivy reads the tarball's layers, so
  # the host architecture is irrelevant.
  scan:
    name: Image · Trivy scan ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      # Needed for .trivyignore.yaml, which the blocking scan reads. The full
      # scan below deliberately does not use it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Trivy - full scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        # Fork PRs have a read-only token and can't upload SARIF; the blocking
        # pass still gates them. Per-arch category so the legs don't overwrite.
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.PLATFORM_PAIR }}

      # Blocking on FIXABLE CRITICAL/HIGH only. The base is debian-slim rather
      # than distroless because the updates module needs real apt and dpkg, and
      # that trade is measured in docs/hardening.md: more unfixable CVEs, none
      # of them actionable. A gate that blocks on unfixable findings is a gate
      # that gets switched off.
      #
      # .trivyignore.yaml is read HERE and not by the full scan above, so a
      # suppressed finding still reaches the Security tab. Every entry in it
      # carries an expiry date and a reason the code is unreachable in muninn's
      # generated configuration — see the file.
      - name: Trivy - blocking scan (fixable CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      # ── SBOM, from the same tarball ──────────────────────────────────────
      # Generated from the artefact rather than from a rebuild or a registry
      # pull, for the reason the whole pipeline is shaped this way: an SBOM that
      # describes different bytes than the ones that shipped is worse than none,
      # because it will be believed. Two packages matter most here and neither
      # comes from Cargo.lock — the Telegraf binary and everything debian-slim
      # brings with apt and dpkg (docs/hardening.md).
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: cyclonedx
          output: sbom-${{ env.PLATFORM_PAIR }}.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.PLATFORM_PAIR }}
          path: sbom-${{ env.PLATFORM_PAIR }}.cdx.json
          if-no-files-found: error
          retention-days: 90

  # ── Integration-test the built artifact (loaded, never rebuilt) ───────────
  # Native runner per arch: the loaded container must run on matching hardware.
  integration:
    name: Image · Integration test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${{ runner.temp }}/image.tar" && docker tag muninn:ci muninn:dev

      # The whole path: muninn, Telegraf, InfluxDB and Prometheus, one metric
      # followed from the host into a database and back out. The harness
      # generates its own throwaway credentials per run — no secret is involved
      # and none is reachable from a PR build.
      - name: System integration (stack)
        run: bash scripts/integration-test.sh muninn:dev

      # The image itself, under the hardening the documentation promises, plus
      # the Docker module against a real socket and through a socket proxy.
      - name: Container tests (hardened image)
        run: bash scripts/container-test.sh muninn:dev

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.integration.yml logs || true
          docker logs muninn-test 2>&1 | tail -50 || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v --remove-orphans || true

  # ── The updates module against real host trees ────────────────────────────
  # Its own job because it builds Debian and Ubuntu fixtures, which is minutes
  # of apt work that should not sit in front of the stack test. Cell S11 (a real
  # host through WSL) skips here and says so; the rest run.
  updates:
    name: Image · Updates module ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${{ runner.temp }}/image.tar" && docker tag muninn:ci muninn:dev

      - name: Updates system tests
        run: bash scripts/updates-test.sh muninn:dev

      # The image_updates counterpart, in the same job rather than its own: it
      # needs the same loaded image and the runner's own Docker daemon, and it
      # is minutes rather than the tens the updates fixtures cost. Every cell
      # resolves a tag against Docker Hub, so it is subject to the same
      # anonymous rate limit the module documents — one run per job, well
      # inside 100 per 6 hours.
      - name: Image updates system tests
        run: bash scripts/image-updates-test.sh muninn:dev

  # ── The two fan-in gates: stage boundaries, and what the ruleset names ────
  #
  # Everything above reports its own check, and a check that is not in the
  # ruleset's required set is an *indicator*: it shows a red cross and stops
  # nobody. Keeping that set in step with this file by hand is how `MSRV` came
  # to run on every pull request for a whole release without ever blocking one,
  # and the same was true of `Version gate`, `Telegraf reference & docs` and
  # both `Updates module` legs. Adding a job here is the moment the omission
  # happens, and it is silent.
  #
  # So the ruleset names these two instead, and they derive the answer from
  # `needs` — which is the same list the pipeline already has to maintain to
  # order itself correctly. A job added to `needs` is covered by the gate the
  # moment it is added, rather than the moment somebody remembers to edit a
  # repository setting they cannot see from here.
  #
  # They are also where the pipeline *waits*: `build` needs `source-gate` and
  # `push` needs `image-gate`, so each stage's membership is written down once.
  # `build` used to re-list the source jobs, and two copies of one list is a list
  # that drifts — `msrv` was missing from that copy, so a job that had run on
  # every pull request for a release gated nothing at all.
  #
  # `if: always()` is load-bearing rather than defensive. Without it a gate
  # whose dependency failed does not fail — it is **skipped**, and a skipped
  # required check counts as satisfied. The gate would then be green by absence
  # in exactly the case it exists for. So it always runs, and reads the results
  # itself rather than letting its own scheduling stand in for them. It is also
  # what keeps the chaining honest: a gate that can never be skipped is a
  # dependency that resolves to a real verdict, so `build` and `push` are
  # skipped precisely when their stage did not pass.
  #
  # `push` and `publish` are deliberately in no gate: both are `push`-only, so
  # on a pull request they report `skipped`, and these checks treat anything
  # that is not `success` as a failure.
  #
  # `continue-on-error` on the beta leg keeps its meaning: that leg reports
  # `success` to `needs` even when it fails, which is what makes it a canary
  # rather than a blocker.
  #
  # The two bodies below, and `security-gate` in security.yml, are identical
  # apart from $STAGE. A local composite action would remove the triplication
  # and would cost each gate an `actions/checkout`; these three jobs currently
  # touch no source and hold no credentials, and that is worth more than twelve
  # deduplicated lines of shell.
  #
  # NOTE: `Source gate` and `Image gate` are the names the branch ruleset
  # requires. A renamed required check never reports again, and a check that
  # never reports blocks every pull request. Do not "harmonise" them with the
  # `Source ·` / `Image ·` prefixes on the jobs above.
  source-gate:
    name: Source gate
    runs-on: ubuntu-latest
    needs: [check, test, msrv, supply-chain, coverage, reference, version-gate]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every source check succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          STAGE: Source
        run: |
          # The table is written before the verdict, so a failing stage still
          # reports which member failed on the run's summary page — that is the
          # case somebody actually reads it in. `tee -a` puts the same lines in
          # the job log, where the run's own output belongs.
          {
            echo "## $STAGE stage"
            echo
            echo "| job | result |"
            echo "|---|---|"
            printf '%s' "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          bad="$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::source gate failed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  image-gate:
    name: Image gate
    runs-on: ubuntu-latest
    needs: [build, scan, integration, updates]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every image check succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          STAGE: Image
        run: |
          {
            echo "## $STAGE stage"
            echo
            echo "| job | result |"
            echo "|---|---|"
            printf '%s' "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          bad="$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::image gate failed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  # ── Push the scanned+tested bytes by digest (push events only) ────────────
  # Skopeo copies straight from the artifact tarball — the exact bytes that
  # scan, integration and updates validated. Skipped on pull_request, so the
  # DockerHub credentials are never reachable from a PR (fork-safe).
  push:
    name: Release · Push image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # The whole image stage, named once. `if:` narrows this job to push events;
    # it does not loosen the dependency — an `if:` without a status function
    # leaves the implicit `success()` on `needs` in place, so a red `image-gate`
    # still skips this job and, through it, `publish`.
    needs: [image-gate]
    if: github.event_name == 'push'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Push scanned image and record its digest
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/muninn
          DHUSER: ${{ vars.DOCKERHUB_USERNAME }}
          DHTOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # skopeo writes and reads its credentials here instead of taking them
          # on the command line. `--dest-creds user:token` puts the token in
          # /proc/<pid>/cmdline, readable by every other process on the runner
          # for as long as the copy runs; an auth file is 0600 and confined to
          # this step's temp directory.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          # Through env, never through an expression inside the shell: workflow
          # expressions are substituted into the script TEXT before bash sees
          # it, so a repository variable would be script rather than data.
          # (Even a mention of the syntax in a comment here is parsed — which is
          # how literally this happens.)
          if [ -z "$DHUSER" ] || [ -z "$DHTOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME (repository variable) and DOCKERHUB_TOKEN (repository secret) are not set — see docs/ci-cd.md"
            exit 1
          fi
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printenv DHTOKEN | skopeo login --username "$DHUSER" --password-stdin docker.io

          mkdir -p "${{ runner.temp }}/digests"
          # Staging tag is only a push target; the user-facing multi-arch tag is
          # created by the `publish` job from the digest recorded here, and the
          # staging tags are deleted again once the manifest exists.
          skopeo copy \
            "docker-archive:${{ runner.temp }}/image.tar" \
            "docker://${REPO}:staging-${PLATFORM_PAIR}" \
            --digestfile "${{ runner.temp }}/digest.txt"
          digest="$(cat "${{ runner.temp }}/digest.txt")"
          echo "Pushed ${PLATFORM_PAIR} as ${REPO}@${digest}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the multi-arch manifest, tag it, tag the release ─────────────
  publish:
    name: Release · Publish to DockerHub
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      # contents: write — the "Create git tag" step. Inheriting `contents: read`
      #   made `git push origin vX.Y.Z` 403.
      # packages: write — the "Mirror image to ghcr.io" step pushes to GHCR with
      #   the built-in GITHUB_TOKEN.
      contents: write
      packages: write
    steps:
      # `persist-credentials: false` here too, and that is a change: this
      # checkout used to keep the token, on the argument that "nothing between
      # here and there executes third-party code". That was not true of this
      # job (F-13). Between the checkout and the tag push it runs
      # `download-artifact`, two `docker/login-action` steps, skopeo, and this
      # repository's own `changelog-version.sh` — any of which would have run
      # with a `RELEASE_PAT` sitting in `.git/config`.
      #
      # The credential is now supplied to the one step that pushes, and removed
      # again when it returns. See "Create git tag" at the end of this job.
      #
      # RELEASE_PAT rather than the built-in token, because of what has to happen
      # after the push: GitHub does not start a workflow from an event that
      # GITHUB_TOKEN created — the recursion guard — so a tag pushed with it
      # fires nothing and release.yml (`on: push: tags`) never runs. That is
      # exactly what v0.1.0 hit: the image, the ghcr mirror and the tag all
      # shipped, and the GitHub Release, the SBOM, the test report and the
      # housekeeping PR did not. It is the same secret prepare-dev already needs,
      # for the same underlying reason.
      #
      # The fallback keeps the pipeline working without the secret: the tag is
      # still created, and release.yml is then driven by hand through its
      # workflow_dispatch entry point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # needed to read git history for version tagging
          persist-credentials: false

      # The guard that used to sit here — "refuse tags that are not on main" —
      # is gone with the tag trigger that made it necessary. A hand-pushed tag
      # no longer starts this workflow at all, so it cannot publish an image.
      # release.yml keeps its own copy of the same check, because a tag *does*
      # start that one.

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ── Version detection (from CHANGELOG.md) ────────────────────────────
      # The shared script validates SemVer before printing, so `version` can only
      # ever be `x.y.z[-pre][+build]` — it is safe to hand on from here. Every
      # consumer below still takes it through `env:`, never through `${{ }}`
      # inside a shell, so the guarantee does not rest on the script alone.
      #
      # --allow-unreleased so that pushes to `dev` keep producing a :x.y.z-dev
      # image before the first release is cut, when the changelog holds only
      # `## [Unreleased]`. The version gate above calls the script WITHOUT it,
      # so a real release still has to name its version in the changelog.
      - name: Read version from CHANGELOG.md
        id: version
        run: |
          VERSION="$(bash scripts/changelog-version.sh --allow-unreleased)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if git tag already exists
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists — skipping tag creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Docker metadata (tags + labels) ───────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/muninn
          tags: |
            # dev branch → :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # dev branch → :x.y.z-dev  (e.g. 0.1.0-dev)
            type=raw,value=${{ steps.version.outputs.version }}-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # main branch → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # main branch + version from CHANGELOG → :x.y.z
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false' }}
            # No `type=semver` entries: they only ever applied on a tag run,
            # and a tag no longer starts this workflow. A hand-pushed tag now
            # publishes nothing, which is what CHANGELOG.md and docs/ci-cd.md
            # have always told operators anyway.
          labels: |
            org.opencontainers.image.title=muninn.io
            org.opencontainers.image.description=Supervisor and configuration layer around Telegraf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/muninn
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: each -t
          # and each digest must become a separate argument.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REPO}@sha256:%s " *)

      # The digest of the manifest this run just created, captured here and
      # carried to the git tag below.
      #
      # It is what makes "the release describes the bytes that shipped" a
      # checkable claim rather than an assumption. A tag is mutable; a digest is
      # not. release.yml refuses to build a Release unless the registry still
      # resolves `:x.y.z` to this exact digest, and generates the SBOM from the
      # digest rather than the tag.
      - name: Inspect manifest
        id: manifest
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/muninn
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REPO}:${VERSION}"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}'             "${REPO}:${VERSION}" | jq -r '.digest // empty')"
          if [ -z "$digest" ]; then
            echo "::error::could not read the manifest digest for ${REPO}:${VERSION}"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "manifest digest: $digest"

      # ── Mirror the finished image to GitHub Container Registry ─────────────
      # `skopeo copy --all` copies the manifest list and every arch blob, so the
      # ghcr image ends up byte-identical (same digests) to the DockerHub image
      # that was scanned and tested — no second build, no ghcr staging tag.
      # Runs for every user-facing tag metadata-action emitted.
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Mirror image to ghcr.io
        env:
          DH_REPO: ${{ vars.DOCKERHUB_USERNAME }}/muninn
          DHUSER: ${{ vars.DOCKERHUB_USERNAME }}
          DHTOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/muninn.io
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reason as the push job: credentials through a 0600 auth file
          # rather than through argv, where every process on the runner can read
          # them out of /proc for the length of the copy.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printenv DHTOKEN   | skopeo login --username "$DHUSER"   --password-stdin docker.io
          printenv GHCR_TOKEN | skopeo login --username "$GHCR_USER" --password-stdin ghcr.io

          echo "$DOCKER_METADATA_OUTPUT_JSON" | jq -r '.tags[]' | while read -r ref; do
            tag="${ref##*:}"
            echo "Mirroring ${DH_REPO}:${tag} -> ${GHCR_REPO}:${tag}"
            skopeo copy --all \
              "docker://${DH_REPO}:${tag}" \
              "docker://${GHCR_REPO}:${tag}"
          done

      # ── Delete the staging tags now the manifest references the digests ───
      # The per-arch manifests survive: the multi-arch manifest list points at
      # them by digest, so removing the tag only drops the pointer. Best-effort;
      # a failure here must not fail a release.
      - name: Remove staging tags
        continue-on-error: true
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/muninn
          DHUSER: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Body through stdin, built by jq rather than by string interpolation:
          # `-d "{...$TOKEN...}"` would put the token in /proc/<pid>/cmdline, and
          # would also break on any character JSON needs escaped. `--data @-`
          # keeps it in a pipe.
          jwt="$(jq -n --arg u "$DHUSER" --arg p "$TOKEN" '{username:$u, password:$p}' \
            | curl -s -H 'Content-Type: application/json' --data @- \
              https://hub.docker.com/v2/users/login/ | jq -r .token)"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "Could not obtain a DockerHub token; leaving staging tags in place"
            exit 0
          fi
          # The session token goes through a curl config on stdin for the same
          # reason as the password above — `-H "Authorization: ..."` is argv.
          for tag in staging-linux-amd64 staging-linux-arm64; do
            code="$(printf 'header = "Authorization: JWT %s"\n' "$jwt" \
              | curl -s -K - -o /dev/null -w '%{http_code}' -X DELETE \
                "https://hub.docker.com/v2/repositories/${REPO}/tags/${tag}/")"
            echo "delete ${tag}: HTTP ${code}"
          done

      # ── Create git tag on main (if new version) ───────────────────────────
      # The only step in this job that holds the push credential, and it holds
      # it for one command (F-13).
      #
      # Through git's `extraheader` rather than a token in the remote URL: a URL
      # is argv, and argv is readable by anything else on the machine and lands
      # in `git remote -v` for whatever runs next. The header is written into
      # the local config, used, and removed on the way out — including when the
      # push fails, which is the case where a leftover credential would
      # otherwise sit in a workspace nobody looks at again.
      - name: Create git tag
        if: github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Annotated with the digest, which is what release.yml checks the
          # registry against before it claims anything about the artefact. An
          # unannotated tag — one made by hand, or by a muninn older than this
          # — makes release.yml stop and say so rather than describe bytes it
          # cannot identify.
          git tag "$TAG" -m "Release $TAG" -m "muninn-manifest-digest: $DIGEST"

          header='http.https://github.com/.extraheader'
          trap 'git config --local --unset-all "$header" 2>/dev/null || true' EXIT

          # Base64 on stdin, not as an argument, for the same reason the Docker
          # Hub steps above pass their credentials through a config file.
          basic="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git config --local "$header" "AUTHORIZATION: basic ${basic}"

          git push "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${TAG}"
