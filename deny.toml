# deny.toml — configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/)
# Run: cargo deny check
#
# cargo-deny is a superset of cargo-audit:
#   - advisories: known vulnerabilities (RustSec database)
#   - licenses:   only approved FOSS licences
#   - bans:       duplicate crates, forbidden crates
#   - sources:    only crates.io as registry (no unknown mirrors)

# ── Advisories (RustSec vulnerability database) ──────────────────────────────
[advisories]
# Advisory IDs to ignore, e.g. an accepted risk or a false positive.
# Every entry needs a comment saying why, and a date to revisit.
ignore = []

# ── Licences ─────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
# Permissive licences only. Note what is NOT here compared to huginn.io's list:
# `OpenSSL`. muninn does not link OpenSSL — the Telegraf binary is a separate
# process with its own Go TLS stack, and muninn's own HTTP surface is plaintext
# on a health port. Leaving the licence out means an OpenSSL dependency
# appearing by accident fails the build instead of passing quietly.
#
# Trimmed to what the tree actually carries. `BSD-2-Clause`, `ISC`, `Zlib`,
# `CC0-1.0` and `MPL-2.0` were allowed and never encountered — cargo-deny says
# so on every run, which is noise, and more to the point an allowance nobody
# has weighed is a decision made in advance for a dependency nobody has looked
# at. MPL-2.0 in particular is weak-copyleft and worth a deliberate "yes" at
# the moment something wants it, not a standing one.
#
# Adding one back is a one-line change with a reason attached, which is the
# shape this list should have.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
]

# ── Bans ─────────────────────────────────────────────────────────────────────
[bans]
# Warn when one crate is pulled in at several versions.
#
# `syn` is currently at 2 and 3, and that is accepted rather than resolved:
# both come in transitively through proc-macro crates, so getting to one
# version means waiting for those crates to move, not changing anything here.
# It stays a warning rather than becoming a `skip` entry, because a skip pins
# the version it was written against and goes stale the morning Dependabot
# moves it — leaving a suppression for a duplicate that no longer exists and
# no warning for the one that does.
multiple-versions = "warn"
# A wildcard version pin is not a pin.
wildcards = "deny"
# Except between muninn's own crates. They are `{ path = ... }` entries in
# [workspace.dependencies] with no version, which is a wildcard by cargo-deny's
# reading and a directory on disk by cargo's — there is no registry, no
# resolution and nothing to pin. Without this the gate fails on the workspace's
# own structure, which is how a required gate stops being run at all.
allow-wildcard-paths = true
deny = [
    { name = "openssl", reason = "muninn adds no TLS stack of its own; see the licence note above" },
    { name = "openssl-sys", reason = "as above" },
]
skip = []

# ── Sources ──────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
# Deny, matching `unknown-registry` above and the crates.io-only policy this
# section states. It was `warn`, which meant a git dependency — a source with
# no registry, no yanking and no advisory coverage — would have entered the
# tree with a line in the log and a green gate. `allow-git` below is empty and
# is where an exception would be recorded, deliberately, one entry at a time.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
