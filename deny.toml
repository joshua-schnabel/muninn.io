# deny.toml — configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/)
# Run: cargo deny check
#
# cargo-deny is a superset of cargo-audit:
#   - advisories: known vulnerabilities (RustSec database)
#   - licenses:   only approved FOSS licences
#   - bans:       duplicate crates, forbidden crates
#   - sources:    only crates.io as registry (no unknown mirrors)

# ── Advisories (RustSec vulnerability database) ──────────────────────────────
[advisories]
# Advisory IDs to ignore, e.g. an accepted risk or a false positive.
# Every entry needs a comment saying why, and a date to revisit.
ignore = []

# ── Licences ─────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
# Permissive licences only. Note what is NOT here compared to huginn.io's list:
# `OpenSSL`. muninn does not link OpenSSL — the Telegraf binary is a separate
# process with its own Go TLS stack, and muninn's own HTTP surface is plaintext
# on a health port. Leaving the licence out means an OpenSSL dependency
# appearing by accident fails the build instead of passing quietly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

# ── Bans ─────────────────────────────────────────────────────────────────────
[bans]
# Warn when one crate is pulled in at several versions.
multiple-versions = "warn"
# A wildcard version pin is not a pin.
wildcards = "deny"
# Except between muninn's own crates. They are `{ path = ... }` entries in
# [workspace.dependencies] with no version, which is a wildcard by cargo-deny's
# reading and a directory on disk by cargo's — there is no registry, no
# resolution and nothing to pin. Without this the gate fails on the workspace's
# own structure, which is how a required gate stops being run at all.
allow-wildcard-paths = true
deny = [
    { name = "openssl", reason = "muninn adds no TLS stack of its own; see the licence note above" },
    { name = "openssl-sys", reason = "as above" },
]
skip = []

# ── Sources ──────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
