# Fixture: the ordering mistake the renderer must never produce.
#
# `ignore_fs` sits AFTER the `[inputs.disk.tagdrop]` header, so TOML parses it
# as `inputs.disk.tagdrop.ignore_fs` — a tagdrop rule on a tag named "ignore_fs"
# that no metric carries. The filesystem exclusions therefore do nothing.
#
# Nothing rejects this. `telegraf config check` exits 0, and Telegraf starts
# happily. The only symptom is metrics you did not ask for.
#
# Measured against Telegraf 1.39.2 with `--test`, inside the telegraf container:
#
#   ordering-correct.conf →  5 disk metrics,  0 with fstype=tmpfs
#   ordering-broken.conf  → 15 disk metrics, 10 with fstype=tmpfs
#
# Kept in the tree so the renderer has something to fail against.

[agent]
  interval = "30s"
  flush_interval = "30s"
  skip_processors_after_aggregators = true

[[inputs.disk]]
  [inputs.disk.tagdrop]
    path = ["/snap*"]
  ignore_fs = ["tmpfs", "devtmpfs"]

[[outputs.prometheus_client]]
  listen = "0.0.0.0:9273"
