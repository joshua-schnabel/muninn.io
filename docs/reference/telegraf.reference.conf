# Generated by muninn 0.1.0 — do not edit.
#
# This file is regenerated from scratch on every start and lives on a tmpfs.
# Edit the muninn configuration instead; this is only its rendered form.
#
# Secret values are shown redacted. The file muninn actually writes at runtime
# contains the resolved values.

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "0s"
  precision = ""
  hostname = "web-01.example.internal"
  omit_hostname = false
  debug = false
  quiet = false
  logfile = ""
  skip_processors_after_aggregators = true

# ── Inputs ────────────────────────────────────────────────────────────────

# module: cpu
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# module: memory
[[inputs.mem]]

# modules: load, system
[[inputs.system]]
  include = ["load", "uptime", "users"]

# module: swap
[[inputs.swap]]

# module: processes
[[inputs.processes]]

# module: disks
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "squashfs", "overlay"]
  [inputs.disk.tagdrop]
    path = ["/snap*", "/var/lib/docker/*"]

# module: disk_io
[[inputs.diskio]]
  [inputs.diskio.tagdrop]
    name = ["loop*", "ram*"]

# module: network
[[inputs.net]]
  [inputs.net.tagdrop]
    interface = ["lo", "veth*", "br-*", "docker0"]

# ── Outputs ───────────────────────────────────────────────────────────────

# output: influxdb
[[outputs.influxdb_v2]]
  urls = ["https://influxdb.example.internal:8086"]
  token = "***"
  organization = "infrastructure"
  bucket = "servers"
  timeout = "5s"
  insecure_skip_verify = false

# output: prometheus
[[outputs.prometheus_client]]
  listen = "0.0.0.0:9273"
  path = "/metrics"
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]
