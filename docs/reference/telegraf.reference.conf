# Generated by muninn 0.1.0 — do not edit.
#
# This file is regenerated from scratch on every start and lives on a tmpfs.
# Edit config/muninn.example.yaml instead; this is only its rendered form.
#
# Secret values are shown redacted. The file muninn actually writes at runtime
# contains the resolved values.

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "0s"
  precision = ""
  hostname = "web-01.example.internal"
  omit_hostname = false
  debug = false
  quiet = false
  logfile = ""
  skip_processors_after_aggregators = true

# ── Inputs ───────────────────────────────────────────────────────────────────

# module: cpu
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# module: memory
[[inputs.mem]]

# modules: load, system
# Telegraf has no inputs.load; load averages, uptime and logged-in users are all
# groups of inputs.system. Both muninn modules therefore render into this single
# instance — two instances would collect every metric twice.
[[inputs.system]]
  include = ["load", "uptime", "users"]

# module: swap
[[inputs.swap]]

# module: processes
[[inputs.processes]]

# module: disks
# exclude_mountpoints has no plugin option: inputs.disk can filter by filesystem
# type but not by path, so the path exclusions become a tagdrop table. It is
# written last because Telegraf parses every key after a sub-table header as
# part of that table.
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "squashfs", "overlay"]
  [inputs.disk.tagdrop]
    path = ["/snap*", "/var/lib/docker/*"]

# module: disk_io
# inputs.diskio offers an include list only, so exclusions go through tagdrop on
# the device name tag.
[[inputs.diskio]]
  [inputs.diskio.tagdrop]
    name = ["loop*", "ram*"]

# module: network
# inputs.net offers an include list only, so exclusions go through tagdrop on
# the interface tag.
[[inputs.net]]
  [inputs.net.tagdrop]
    interface = ["lo", "veth*", "br-*", "docker0"]

# ── Outputs ──────────────────────────────────────────────────────────────────

# output: influxdb
[[outputs.influxdb_v2]]
  urls = ["https://influxdb.example.internal:8086"]
  token = "***"
  organization = "infrastructure"
  bucket = "servers"
  timeout = "5s"
  insecure_skip_verify = false

# output: prometheus
# gocollector and process are excluded so this endpoint carries host metrics
# only. They describe the Telegraf process itself, which is muninn's business to
# report — muninn_telegraf_* on the health port — not something that belongs in
# a host metric series.
[[outputs.prometheus_client]]
  listen = "0.0.0.0:9273"
  path = "/metrics"
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]
