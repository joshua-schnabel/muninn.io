# Fixture: the sub-table ordering the renderer must produce.
#
# Pair with ordering-broken.conf. The two differ only in whether `ignore_fs`
# comes before or after the `[inputs.disk.tagdrop]` header, and BOTH pass
# `telegraf config check` with exit 0 — which is the whole point. See
# docs/adr/0007-tagdrop-and-render-order.md for the measured difference.
#
# WP3 turns this pair into an automated regression test.

[agent]
  interval = "30s"
  flush_interval = "30s"
  skip_processors_after_aggregators = true

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs"]
  [inputs.disk.tagdrop]
    path = ["/snap*"]

[[outputs.prometheus_client]]
  listen = "0.0.0.0:9273"
