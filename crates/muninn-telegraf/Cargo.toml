[package]
name = "muninn-telegraf"
description = "Typed Telegraf configuration model, deterministic TOML renderer and child-process control for muninn.io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
muninn-core = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Unix only: muninn's artefact is a Linux container, and Windows has no SIGTERM.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
